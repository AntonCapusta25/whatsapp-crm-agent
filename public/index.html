<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Agent Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-dark: #0b141a;
            --panel-bg: #111b21;
            --chat-bg: #0b141a;
            --active-chat: #2a3942;
            --hover-chat: #202c33;
            --bubble-out: #005c4b;
            --bubble-in: #202c33;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --border-color: #222e35;
            --accent-green: #00a884;
            --accent-blue: #53bdeb;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: #0b141a;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #root {
            width: 100%;
            height: 100%;
            display: flex;
        }

        /* App Layout Container */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            background-color: var(--panel-bg);
            position: relative;
        }

        /* Left Side Panel (Sidebar) */
        .sidebar {
            width: 30%;
            min-width: 320px;
            max-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            background-color: var(--panel-bg);
        }

        /* Sidebar Header */
        .sidebar-header {
            height: 60px;
            background-color: var(--hover-chat);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00a884 0%, #53bdeb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            color: white;
            font-size: 1.1rem;
            user-select: none;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f59e0b;
        }

        .status-dot.ready {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .status-dot.error {
            background-color: #ef4444;
        }

        /* Search Bar */
        .search-container {
            padding: 0.5rem 0.75rem;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--hover-chat);
            border-radius: 8px;
            padding: 0.4rem 0.75rem;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }

        .search-input:focus {
            outline: none;
        }

        /* Chat List Container */
        .chat-list {
            flex-grow: 1;
            overflow-y: auto;
        }

        .chat-list::-webkit-scrollbar {
            width: 6px;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Chat Item */
        .chat-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .chat-item:hover {
            background-color: var(--hover-chat);
        }

        .chat-item.active {
            background-color: var(--active-chat);
        }

        .chat-item-info {
            flex-grow: 1;
            margin-left: 0.75rem;
            overflow: hidden;
        }

        .chat-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }

        .chat-name {
            font-weight: 500;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .chat-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .chat-item-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-last-message {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            padding-right: 0.5rem;
        }

        .unread-count {
            background-color: var(--accent-green);
            color: #111b21;
            font-size: 0.75rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 4px;
        }

        /* Right Side Chat Window */
        .chat-window {
            flex-grow: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            position: relative;
        }

        /* Default Placeholder Landing Screen */
        .placeholder-screen {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #222e35;
            text-align: center;
            border-left: 1px solid var(--border-color);
            background: linear-gradient(180deg, #182229 0%, #111b21 100%);
        }

        .placeholder-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .placeholder-title {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 300;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .placeholder-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            max-width: 450px;
            line-height: 1.5;
        }

        /* Chat Window Header */
        .chat-header {
            height: 60px;
            background-color: var(--hover-chat);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.25rem;
            border-left: 1px solid var(--border-color);
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chat-header-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .chat-header-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }

        /* Messages Scroll Container */
        .messages-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background-color: #0b141a;
            /* Authentic WhatsApp Web background pattern look */
            background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 0);
            background-size: 24px 24px;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.12);
        }

        /* Message Bubbles */
        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.sent {
            justify-content: flex-end;
        }

        .message-row.received {
            justify-content: flex-start;
        }

        .bubble {
            padding: 0.4rem 0.65rem 0.4rem 0.75rem;
            border-radius: 8px;
            max-width: 60%;
            font-size: 0.9rem;
            line-height: 1.45;
            position: relative;
            word-wrap: break-word;
            display: inline-flex;
            flex-direction: column;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
        }

        .bubble.sent {
            background-color: var(--bubble-out);
            color: var(--text-main);
            border-top-right-radius: 0px;
        }

        .bubble.received {
            background-color: var(--bubble-in);
            color: var(--text-main);
            border-top-left-radius: 0px;
        }

        .bubble-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 0.2rem;
            align-self: flex-end;
            gap: 0.25rem;
        }

        .bubble-ticks {
            color: var(--accent-blue);
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* Chat Input Bar */
        .input-bar {
            height: 62px;
            background-color: var(--hover-chat);
            display: flex;
            align-items: center;
            padding: 0 1.25rem;
            gap: 1rem;
            border-left: 1px solid var(--border-color);
        }

        .input-form {
            display: flex;
            flex-grow: 1;
            background-color: #2a3942;
            border-radius: 8px;
            padding: 0.5rem 0.85rem;
            align-items: center;
        }

        .chat-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.95rem;
        }

        .chat-input:focus {
            outline: none;
        }

        .send-icon {
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.15s ease;
            user-select: none;
        }

        .send-icon:hover {
            color: var(--text-main);
        }

        /* QR Scan Popup overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 20, 26, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .qr-modal {
            background-color: #222e35;
            padding: 3rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid var(--border-color);
            max-width: 450px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.5);
        }

        .qr-modal h2 {
            font-family: var(--font-display);
            margin-bottom: 0.75rem;
            font-size: 1.6rem;
        }

        .qr-modal p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .qr-box {
            padding: 1rem;
            background-color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        /* Loading full screen overlay */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1100;
            gap: 1.5rem;
        }

        .sync-bar-bg {
            width: 250px;
            height: 3px;
            background-color: #222e35;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .sync-bar-progress {
            height: 100%;
            background-color: var(--accent-green);
            width: 0%;
            transition: width 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [status, setStatus] = useState('INITIALIZING');
            const [qrText, setQrText] = useState('');
            const [syncPercent, setSyncPercent] = useState(0);
            const [syncMsg, setSyncMsg] = useState('');
            
            const [chats, setChats] = useState([]);
            const [activeChat, setActiveChat] = useState(null);
            const [messages, setMessages] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [inputText, setInputText] = useState('');
            
            const messagesEndRef = useRef(null);

            // Fetch Chats once Ready
            const loadChats = async () => {
                try {
                    const res = await fetch('/api/chats');
                    const data = await res.json();
                    if (res.ok && data.success) {
                        setChats(data.chats);
                    }
                } catch (e) {
                    console.error('Error fetching chats:', e);
                }
            };

            // Fetch history when active chat changes
            useEffect(() => {
                if (!activeChat) return;

                const fetchHistory = async () => {
                    try {
                        const res = await fetch(`/api/history/jid/${encodeURIComponent(activeChat.id)}`);
                        const data = await res.json();
                        if (res.ok && data.success) {
                            setMessages(data.messages);
                        }
                    } catch (e) {
                        console.error('Error fetching messages:', e);
                    }
                };

                fetchHistory();
            }, [activeChat]);

            // Auto-scroll messages
            useEffect(() => {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [messages]);

            // SSE Event stream
            useEffect(() => {
                const eventSource = new EventSource('/events');

                eventSource.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'status') {
                        setStatus(data.status);
                        if (data.status === 'READY') {
                            loadChats();
                        }
                    }
                    else if (data.type === 'qr') {
                        setQrText(data.qr);
                    }
                    else if (data.type === 'sync') {
                        setSyncPercent(data.percent);
                        setSyncMsg(data.message);
                    }
                    else if (data.type === 'log') {
                        // Real-time message receiver update
                        const messageFrom = data.phone;
                        const isSentByMe = data.logType === 'OUTGOING';
                        
                        // 1. If this log belongs to our active chat, append it
                        if (activeChat && (
                            (isSentByMe && activeChat.id.includes(messageFrom)) ||
                            (!isSentByMe && activeChat.id.includes(messageFrom))
                        )) {
                            setMessages(prev => [...prev, {
                                body: data.body,
                                fromMe: isSentByMe,
                                timestamp: Math.floor(data.timestamp / 1000)
                            }]);
                        }

                        // 2. Refresh active chat last message in the sidebar
                        setChats(prevChats => {
                            const newChats = prevChats.map(c => {
                                if (c.id.includes(messageFrom)) {
                                    return {
                                        ...c,
                                        lastMessage: data.body,
                                        timestamp: Math.floor(data.timestamp / 1000)
                                    };
                                }
                                return c;
                            });
                            // Sort again
                            return [...newChats].sort((a, b) => b.timestamp - a.timestamp);
                        });
                    }
                };

                eventSource.onerror = () => {
                    setStatus('OFFLINE');
                };

                return () => {
                    eventSource.close();
                };
            }, [activeChat]);

            // Render QR Code modal dynamically
            useEffect(() => {
                if (status === 'AWAITING_QR_SCAN' && qrText) {
                    const container = document.getElementById('qr-modal-container');
                    if (container) {
                        container.innerHTML = '';
                        new QRCode(container, {
                            text: qrText,
                            width: 220,
                            height: 220,
                            colorDark: '#000000',
                            colorLight: '#ffffff',
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    }
                }
            }, [status, qrText]);

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!inputText.trim() || !activeChat) return;

                const phone = activeChat.id.split('@')[0];
                const msgBody = inputText.trim();
                setInputText('');

                // Optimistically append outgoing message locally
                setMessages(prev => [...prev, {
                    body: msgBody,
                    fromMe: true,
                    timestamp: Math.floor(Date.now() / 1000)
                }]);

                try {
                    const res = await fetch('/api/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone, message: msgBody })
                    });
                    
                    if (!res.ok) {
                        console.error('Failed to send');
                    }
                } catch (err) {
                    console.error('Error manual send:', err);
                }
            };

            const filteredChats = chats.filter(c => 
                c.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                c.id.includes(searchTerm)
            );

            // Helpers for displaying timestamps in WhatsApp style
            const formatTime = (timestamp) => {
                if (!timestamp) return '';
                const date = new Date(timestamp * 1000);
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            };

            return (
                <div class="app-container">
                    {/* Status Loading Overlays */}
                    {status === 'INITIALIZING' && (
                        <div class="loading-screen">
                            <div class="avatar" style={{width: '60px', height: '60px', fontSize: '1.8rem'}}>🤖</div>
                            <h2 style={{fontFamily: 'Outfit'}}>Initializing Agent Client</h2>
                            <p style={{color: 'var(--text-muted)'}}>Starting headless browser context...</p>
                            <div class="sync-bar-bg"><div class="sync-bar-progress" style={{width: '100%', animation: 'spin 2s linear infinite'}}></div></div>
                        </div>
                    )}

                    {status === 'AUTHENTICATED' && (
                        <div class="loading-screen">
                            <div class="avatar" style={{width: '60px', height: '60px', fontSize: '1.8rem'}}>✅</div>
                            <h2 style={{fontFamily: 'Outfit'}}>Logged In successfully</h2>
                            <p style={{color: 'var(--text-muted)'}}>{syncMsg || 'Syncing chats and contact profiles...'}</p>
                            <div class="sync-bar-bg">
                                <div class="sync-bar-progress" style={{width: `${syncPercent || 20}%`}}></div>
                            </div>
                        </div>
                    )}

                    {status === 'AWAITING_QR_SCAN' && (
                        <div class="overlay">
                            <div class="qr-modal">
                                <h2>Link WhatsApp</h2>
                                <p>Scan this QR code using WhatsApp on your mobile phone to register this session.</p>
                                <div class="qr-box" id="qr-modal-container"></div>
                                <div class="status-badge" style={{marginTop: '1rem'}}>
                                    <div class="status-dot"></div>
                                    <span>Awaiting Scan</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Sidebar */}
                    <div class="sidebar">
                        <div class="sidebar-header">
                            <div class="user-profile">
                                <div class="avatar">🤖</div>
                                <div style={{fontSize: '0.9rem', fontWeight: 600}}>Agent Session</div>
                            </div>
                            <div class="status-badge">
                                <div class={`status-dot ${status === 'READY' ? 'ready' : ''}`}></div>
                                <span>{status}</span>
                            </div>
                        </div>

                        {/* Search */}
                        <div class="search-container">
                            <div class="search-box">
                                <span>🔍</span>
                                <input 
                                    type="text" 
                                    class="search-input" 
                                    placeholder="Search or start new chat" 
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>
                        </div>

                        {/* Chat List */}
                        <div class="chat-list">
                            {filteredChats.map(chat => (
                                <div 
                                    key={chat.id} 
                                    class={`chat-item ${activeChat && activeChat.id === chat.id ? 'active' : ''}`}
                                    onClick={() => setActiveChat(chat)}
                                >
                                    <div class="avatar">{chat.name.charAt(0).toUpperCase()}</div>
                                    <div class="chat-item-info">
                                        <div class="chat-item-header">
                                            <span class="chat-name">{chat.name}</span>
                                            <span class="chat-time">{formatTime(chat.timestamp)}</span>
                                        </div>
                                        <div class="chat-item-body">
                                            <span class="chat-last-message">{chat.lastMessage || 'No messages yet'}</span>
                                            {chat.unreadCount > 0 && <span class="unread-count">{chat.unreadCount}</span>}
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {filteredChats.length === 0 && (
                                <div class="placeholder-text" style={{marginTop: '2rem'}}>No chats found.</div>
                            )}
                        </div>
                    </div>

                    {/* Active Chat Window */}
                    <div class="chat-window">
                        {activeChat ? (
                            <React.Fragment>
                                <div class="chat-header">
                                    <div class="chat-header-info">
                                        <div class="avatar">{activeChat.name.charAt(0).toUpperCase()}</div>
                                        <div>
                                            <div class="chat-header-name">{activeChat.name}</div>
                                            <div class="chat-header-status">{activeChat.id}</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="messages-container">
                                    {messages.map((msg, index) => (
                                        <div key={index} class={`message-row ${msg.fromMe ? 'sent' : 'received'}`}>
                                            <div class={`bubble ${msg.fromMe ? 'sent' : 'received'}`}>
                                                <div class="bubble-text">{msg.body}</div>
                                                <div class="bubble-meta">
                                                    <span>{formatTime(msg.timestamp)}</span>
                                                    {msg.fromMe && <span class="bubble-ticks">✓✓</span>}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={messagesEndRef} />
                                </div>

                                <form class="input-bar" onSubmit={handleSendMessage}>
                                    <span>😊</span>
                                    <div class="input-form">
                                        <input 
                                            type="text" 
                                            class="chat-input" 
                                            placeholder="Type a message" 
                                            value={inputText}
                                            onChange={(e) => setInputText(e.target.value)}
                                        />
                                    </div>
                                    <button type="submit" style={{background: 'none', border: 'none'}}>
                                        <span class="send-icon">➤</span>
                                    </button>
                                </form>
                            </React.Fragment>
                        ) : (
                            <div class="placeholder-screen">
                                <div class="placeholder-icon">💬</div>
                                <h2 class="placeholder-title">WhatsApp Automation Agent</h2>
                                <p class="placeholder-desc">
                                    Select any chat in the sidebar to review message logs or send manual overrides. All outgoing messages adhere to the queue limits.
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
